# lefthook.yml
# Git hooks configuration for ms-argus-bio

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: '*.{ts,tsx}'
      run: npx tsc -b --noEmit
    lint:
      glob: '*.{ts,tsx}'
      run: npx eslint {staged_files} --max-warnings 50
    format:
      glob: '*.{ts,tsx,json,md,yml,yaml}'
      run: npx prettier --check {staged_files}

pre-push:
  parallel: true
  commands:
    build:
      run: npm run build
    dead-code:
      run: npm run dead-code
    duplication:
      run: npm run duplication
